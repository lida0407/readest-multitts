<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Readest MultiTTS Reader</title>
    <link rel="stylesheet" href="css/reader.css">
</head>
<body class="theme-light mode-paginated">
    <div id="reader-viewport">
        <div id="content-container">
            <div class="chapter-header">
                <h1 id="book-title">Readest++</h1>
            </div>
            <p class="paragraph">Import a book to start reading page by page.</p>
        </div>
    </div>

    <!-- Persistent Bottom Status Bar -->
    <div id="page-footer">
        <span id="footer-chapter-title" class="footer-chapter-title">Ready</span>
        <span id="footer-page-info">Page 1 / 1</span>
    </div>

    <script src="js/reader.js"></script>
</body>
</html>
