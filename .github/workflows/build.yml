name: Build APK

# Every push to main produces a downloadable APK so the build stays honest.
#
# Releases are NOT published from here on purpose: each runner generates its own
# debug signing key, so a CI-built APK cannot install over a phone that already
# has a locally-built copy. Releases are cut with ./release.sh instead, which
# signs with the same debug keystore every time.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK with the version
        id: name
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "Readest-MultiTTS-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readest-MultiTTS-v${{ steps.name.outputs.version }}
          path: Readest-MultiTTS-v${{ steps.name.outputs.version }}.apk
