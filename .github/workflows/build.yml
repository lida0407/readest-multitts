name: Build APK

# Every push to main produces a downloadable APK, and a tag publishes a release,
# so the phone can be updated straight from GitHub.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK with the version
        id: name
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "Readest-MultiTTS-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readest-MultiTTS-v${{ steps.name.outputs.version }}
          path: Readest-MultiTTS-v${{ steps.name.outputs.version }}.apk

      - name: Publish release on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Readest-MultiTTS-v${{ steps.name.outputs.version }}.apk
          generate_release_notes: true
